name: Build GTA6 Prank EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW & Tools
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 unzip curl

      - name: Compile GTA6.exe
        run: |
          mkdir -p dist
          if [ -f "gta6.ico" ]; then
            echo '1 ICON "gta6.ico"' > resource.rc
            x86_64-w64-mingw32-windres resource.rc -O coff -o resource.res
            x86_64-w64-mingw32-g++ main.cpp resource.res -o dist/GTA6.exe -mwindows -O2 -static
          else
            x86_64-w64-mingw32-g++ main.cpp -o dist/GTA6.exe -mwindows -O2 -static
          fi

      - name: Download Official ffplay.exe
        run: |
          curl -fL "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -o ffmpeg.zip
          unzip -j ffmpeg.zip "*/bin/ffplay.exe" -d dist/
          ls -lh dist/

      - name: Upload Ready-to-Use Package
        uses: actions/upload-artifact@v4
        with:
          name: GTA6-GameHub-Ready
          path: dist/
